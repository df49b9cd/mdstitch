[package]
edition = "2024"
rust-version = "1.95.0"
name = "mdstitch"
version = "0.1.1"
authors = ["Soeren Magnus Olesen"]
exclude = ["proptest-regressions/**"]
description = "Streaming markdown preprocessor that closes unterminated syntax token-by-token."
homepage = "https://github.com/df49b9cd/mdstitch"
documentation = "https://docs.rs/mdstitch"
readme = "README.md"
keywords = [
    "markdown",
    "streaming",
    "pulldown-cmark",
    "commonmark",
]
categories = [
    "text-processing",
    "parser-implementations",
]
license = "Apache-2.0"
repository = "https://github.com/df49b9cd/mdstitch"
resolver = "2"

[dependencies]
# memchr (SIMD) finds any of the builtin-handler trigger bytes far faster
# than a scalar scan; used by `has_no_enabled_markers` to make the
# marker-absence fast path nearly free on plain prose (no triggers found).
memchr = "2.8"

[lib]
name = "mdstitch"
path = "src/lib.rs"

[dev-dependencies]
criterion = { version = "0.8" }
proptest = { version = "1.11.0" }

[[bench]]
name = "stitch"
harness = false


[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
redundant_closure = "warn"
map_unwrap_or = "warn"
match_same_arms = "allow"
unnested_or_patterns = "warn"

[lints.rust]
unexpected_cfgs = "warn"
unsafe_op_in_unsafe_fn = "warn"
