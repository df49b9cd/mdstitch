name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  verify:
    name: build / test / clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --all -- --check

      - name: Doc
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  seeds:
    # Regression-corpus replay at reduced case count. The idempotency sweep
    # is a normal (non-ignored) test now, so `cargo test` in the `verify` job
    # already runs it at the module default; this job re-runs it explicitly
    # with a larger case budget so the persisted seeds under
    # proptest-regressions/tests/ serve as a real gate: proptest replays
    # every saved seed before generating novel cases.
    name: proptest seed replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Replay idempotency seeds
        run: cargo test --lib --release -- fuzz_idempotent_all_option_combinations
        env:
          PROPTEST_CASES: "2000"

  bench-smoke:
    # Cheap guard that benches still compile and run; not a perf gate.
    name: benches compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check benches
        run: cargo check --benches --all-targets
